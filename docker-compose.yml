name: juben-sha

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  - TZ=Asia/Shanghai
  - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
  - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
  - WECHAT_APP_ID=${WECHAT_APP_ID:?WECHAT_APP_ID is required}
  - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
  - FASTCLAW_BASE_URL=http://fastclaw:18953
  - FASTCLAW_API_KEY=${FASTCLAW_API_KEY:?FASTCLAW_API_KEY is required}
  - FASTCLAW_AGENT_ID=${FASTCLAW_AGENT_ID:-}
  - FASTCLAW_TIMEOUT_MS=${FASTCLAW_TIMEOUT_MS:-120000}
  - FASTCLAW_FALLBACK_ENABLED=${FASTCLAW_FALLBACK_ENABLED:-false}
  # 角色 Agent 架构总开关，默认 false
  - USE_ROLEPLAY_AGENTS=${USE_ROLEPLAY_AGENTS:-false}
  - CHAT_EFFECTS_ASYNC_ENABLED=${CHAT_EFFECTS_ASYNC_ENABLED:-false}
  - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:?PAYMENT_PROVIDER is required}
  - PAYMENT_MERCHANT_ID=${PAYMENT_MERCHANT_ID:-}
  - PAYMENT_APP_ID=${PAYMENT_APP_ID:-}
  - PAYMENT_SECRET=${PAYMENT_SECRET:-}
  - PAYMENT_PUBLIC_KEY=${PAYMENT_PUBLIC_KEY:-}
  - PAYMENT_PRIVATE_KEY=${PAYMENT_PRIVATE_KEY:-}
  - PAYMENT_NOTIFY_URL=${PAYMENT_NOTIFY_URL:-}
  - PAYMENT_RETURN_URL=${PAYMENT_RETURN_URL:-}
  - ADMIN_ORIGIN=${ADMIN_ORIGIN:?ADMIN_ORIGIN is required}
  - TEST_USER_INITIAL_POINTS=${TEST_USER_INITIAL_POINTS:-0}
  # 本地素材库（内容寻址：<root>/<hash[0:2]>/<hash>.<ext>）。必须与 api 服务的命名卷挂载点一致：
  # 容器可写层会随重建消失，而 media_assets 行留在 postgres_data 卷里，结果就是已发布头像/封面
  # 永久 404。tools profile 只跑迁移/种子，不写素材，所以不需要这个卷。
  - MEDIA_ROOT=/app/data/media

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: juben-sha-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=juben_sha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d juben_sha']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    networks:
      - juben-sha-network

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: juben-sha-api
    restart: unless-stopped
    environment: *api-environment
    # 素材是本地文件存储（无对象存储/CDN），必须落在命名卷上：`docker compose up -d` 换镜像会
    # 重建容器，挂载点之外的文件全部丢失。空命名卷首次挂载会继承镜像里 /app/data 的 nextjs:nodejs
    # 属主，所以 Dockerfile 里的 chown 已经覆盖权限。备份必须与 PostgreSQL 一起做。
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      fastclaw:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/health").then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))']
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    networks:
      - juben-sha-network

  api-migrate:
    image: ${API_TOOLS_IMAGE:?API_TOOLS_IMAGE is required}
    profiles:
      - tools
    command: pnpm --filter @juben-sha/api db:migrate
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - juben-sha-network

  api-seed:
    image: ${API_TOOLS_IMAGE:?API_TOOLS_IMAGE is required}
    profiles:
      - tools
    command: pnpm --filter @juben-sha/api seed
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - juben-sha-network

  fastclaw:
    image: ${FASTCLAW_IMAGE:?FASTCLAW_IMAGE is required}
    container_name: juben-sha-fastclaw
    restart: unless-stopped
    environment:
      - FASTCLAW_BIND=all
      - FASTCLAW_LOG_LEVEL=${FASTCLAW_LOG_LEVEL:-info}
      - FASTCLAW_STORAGE_DSN=${FASTCLAW_STORAGE_DSN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TZ=Asia/Shanghai
    volumes:
      - fastclaw-data:/data/.fastclaw
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:18953/readyz']
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    networks:
      - juben-sha-network

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    container_name: juben-sha-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - CADDY_API_SITE_ADDRESS=${CADDY_API_SITE_ADDRESS:?CADDY_API_SITE_ADDRESS is required}
      - TZ=Asia/Shanghai
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *default-logging
    networks:
      - juben-sha-network

volumes:
  postgres_data:
  media_data:
  fastclaw-data:
  caddy_data:
  caddy_config:

networks:
  juben-sha-network:
    driver: bridge
