name: juben-sha

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  - TZ=Asia/Shanghai
  - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
  - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
  - WECHAT_APP_ID=${WECHAT_APP_ID:?WECHAT_APP_ID is required}
  - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
  - FASTCLAW_BASE_URL=http://fastclaw:18953
  - FASTCLAW_API_KEY=${FASTCLAW_API_KEY:?FASTCLAW_API_KEY is required}
  - FASTCLAW_AGENT_ID=${FASTCLAW_AGENT_ID:-}
  - FASTCLAW_TIMEOUT_MS=${FASTCLAW_TIMEOUT_MS:-120000}
  - FASTCLAW_FALLBACK_ENABLED=${FASTCLAW_FALLBACK_ENABLED:-false}
  - CHAT_EFFECTS_ASYNC_ENABLED=${CHAT_EFFECTS_ASYNC_ENABLED:-false}
  - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:?PAYMENT_PROVIDER is required}
  - PAYMENT_MERCHANT_ID=${PAYMENT_MERCHANT_ID:-}
  - PAYMENT_APP_ID=${PAYMENT_APP_ID:-}
  - PAYMENT_SECRET=${PAYMENT_SECRET:-}
  - PAYMENT_PUBLIC_KEY=${PAYMENT_PUBLIC_KEY:-}
  - PAYMENT_PRIVATE_KEY=${PAYMENT_PRIVATE_KEY:-}
  - PAYMENT_NOTIFY_URL=${PAYMENT_NOTIFY_URL:-}
  - PAYMENT_RETURN_URL=${PAYMENT_RETURN_URL:-}
  - ADMIN_USER_IDS=${ADMIN_USER_IDS:?ADMIN_USER_IDS is required}
  - ADMIN_BASIC_AUTH_USER=${ADMIN_BASIC_AUTH_USER:?ADMIN_BASIC_AUTH_USER is required}
  - ADMIN_BASIC_AUTH_PASSWORD=${ADMIN_BASIC_AUTH_PASSWORD:?ADMIN_BASIC_AUTH_PASSWORD is required}
  - TEST_USER_INITIAL_POINTS=${TEST_USER_INITIAL_POINTS:-0}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: juben-sha-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=juben_sha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d juben_sha']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    networks:
      - juben-sha-network

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: juben-sha-api
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      fastclaw:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/health").then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))']
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    networks:
      - juben-sha-network

  api-migrate:
    image: ${API_TOOLS_IMAGE:?API_TOOLS_IMAGE is required}
    profiles:
      - tools
    command: pnpm --filter @juben-sha/api db:migrate
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - juben-sha-network

  api-seed:
    image: ${API_TOOLS_IMAGE:?API_TOOLS_IMAGE is required}
    profiles:
      - tools
    command: pnpm --filter @juben-sha/api seed
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - juben-sha-network

  fastclaw:
    image: ${FASTCLAW_IMAGE:?FASTCLAW_IMAGE is required}
    container_name: juben-sha-fastclaw
    restart: unless-stopped
    environment:
      - FASTCLAW_BIND=all
      - FASTCLAW_STORAGE_DSN=${FASTCLAW_STORAGE_DSN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TZ=Asia/Shanghai
    volumes:
      - fastclaw-data:/data/.fastclaw
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:18953/readyz']
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    networks:
      - juben-sha-network

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    container_name: juben-sha-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - CADDY_API_SITE_ADDRESS=${CADDY_API_SITE_ADDRESS:?CADDY_API_SITE_ADDRESS is required}
      - TZ=Asia/Shanghai
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *default-logging
    networks:
      - juben-sha-network

volumes:
  postgres_data:
  fastclaw-data:
  caddy_data:
  caddy_config:

networks:
  juben-sha-network:
    driver: bridge
