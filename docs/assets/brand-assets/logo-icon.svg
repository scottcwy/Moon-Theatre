<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#F6C677" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#F6C677" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F6C677" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="42%" cy="36%" r="66%">
      <stop offset="0%" stop-color="#FDF0C8"/>
      <stop offset="55%" stop-color="#F7DA9E"/>
      <stop offset="100%" stop-color="#EFC576"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE7AE"/>
      <stop offset="100%" stop-color="#F0AE55"/>
    </radialGradient>
    <radialGradient id="lantern" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFB066"/>
      <stop offset="100%" stop-color="#E2732E"/>
    </radialGradient>
  </defs>

  <!-- warm circular disc + ring -->
  <circle cx="512" cy="512" r="452" fill="#FFF7F1"/>
  <circle cx="512" cy="512" r="452" fill="none" stroke="#E5CFC2" stroke-width="3"/>

  <circle cx="512" cy="400" r="330" fill="url(#halo)"/>

  <!-- full moon -->
  <circle cx="512" cy="392" r="240" fill="url(#moon)"/>
  <circle cx="442" cy="340" r="22" fill="#E9BE73" opacity="0.5"/>
  <circle cx="572" cy="404" r="28" fill="#E9BE73" opacity="0.42"/>

  <!-- clouds -->
  <g fill="#FFFDF8">
    <rect x="236" y="570" width="130" height="20" rx="10"/>
    <rect x="268" y="550" width="88" height="16" rx="8"/>
    <rect x="646" y="572" width="146" height="20" rx="10"/>
    <rect x="688" y="550" width="92" height="16" rx="8"/>
  </g>

  <!-- tower silhouette -->
  <g fill="#3E222E">
    <path d="M 440 558 Q 384 588 344 634 Q 512 656 680 634 Q 616 588 584 558 Q 512 546 440 558 Z"/>
    <path d="M 344 634 Q 328 616 336 598 Q 350 612 356 630 Z"/>
    <path d="M 680 634 Q 696 616 688 598 Q 674 612 668 630 Z"/>
    <rect x="416" y="634" width="192" height="72" rx="8"/>

    <path d="M 388 706 Q 336 728 300 754 Q 512 776 724 754 Q 664 728 636 706 Q 512 694 388 706 Z"/>
    <path d="M 300 754 Q 284 736 292 718 Q 306 732 312 750 Z"/>
    <path d="M 724 754 Q 740 736 732 718 Q 718 732 712 750 Z"/>
    <rect x="384" y="754" width="256" height="88" rx="10"/>

    <rect x="358" y="842" width="308" height="24" rx="8" fill="#54303E"/>
  </g>

  <!-- windows & door (amber light) -->
  <g fill="url(#windowGlow)">
    <rect x="446" y="658" width="32" height="48" rx="16"/>
    <rect x="546" y="658" width="32" height="48" rx="16"/>
    <rect x="416" y="780" width="28" height="44" rx="14"/>
    <rect x="580" y="780" width="28" height="44" rx="14"/>
    <path d="M 492 842 L 492 796 Q 512 776 532 796 L 532 842 Z"/>
  </g>

  <!-- hanging lantern (larger) -->
  <g>
    <line x1="690" y1="598" x2="690" y2="644" stroke="#3E222E" stroke-width="4"/>
    <circle cx="690" cy="672" r="48" fill="#F6C677" opacity="0.32"/>
    <rect x="682" y="640" width="16" height="10" rx="3" fill="#3E222E"/>
    <circle cx="690" cy="672" r="30" fill="url(#lantern)"/>
    <rect x="682" y="698" width="16" height="9" rx="3" fill="#3E222E"/>
    <rect x="686" y="704" width="8" height="20" rx="3" fill="#C65A2E"/>
    <path d="M 690 724 l 9 11 -9 5 -9 -5 z" fill="#C65A2E"/>
  </g>
